<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .result {
            margin-top: 2rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 5px;
            text-align: center;
        }
        .result h3 {
            color: #28a745;
            margin: 0;
        }
        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #667eea;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Fraud Transaction Prediction</h1>
        
        <form method="POST" action="/predict">
            <div class="form-group">
                <label for="transaction_amount">Transaction Amount:</label>
                <input type="number" id="transaction_amount" name="transaction_amount" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="payment_method">Payment Method:</label>
                <select id="payment_method" name="payment_method" required>
                    <option value="">Select Payment Method</option>
                    <option value="debit card">Debit Card</option>
                    <option value="credit card">Credit Card</option>
                    <option value="bank transfer">Bank Transfer</option>
                </select>
            </div>
            <div class="form-group">
                <label for="product_category">Product Category:</label>
                <select id="product_category" name="product_category" required>
                    <option value="">Select Category</option>
                    <option value="health & beauty">Health & Beauty</option>
                    <option value="electronics">Electronics</option>
                    <option value="toys & games">Toys & Games</option>
                    <option value="home & garden">Home & Garden</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity" min="1" required>
            </div>
            <div class="form-group">
                <label for="customer_age">Customer Age:</label>
                <input type="number" id="customer_age" name="customer_age" min="10" max="99" required>
            </div>
            <div class="form-group">
                <label for="customer_location">Customer Location:</label>
                <input type="text" id="customer_location" name="customer_location" required>
            </div>
            <div class="form-group">
                <label for="device_used">Device Used:</label>
                <select id="device_used" name="device_used" required>
                    <option value="">Select Device</option>
                    <option value="desktop">Desktop</option>
                    <option value="mobile">Mobile</option>
                    <option value="tablet">Tablet</option>
                </select>
            </div>
            <div class="form-group">
                <label for="account_age_days">Account Age (days):</label>
                <input type="number" id="account_age_days" name="account_age_days" min="0" required>
            </div>
            <div class="form-group">
                <label for="transaction_hour">Transaction Hour (0-23):</label>
                <input type="number" id="transaction_hour" name="transaction_hour" min="0" max="23" required>
            </div>
            <button type="submit" class="btn">Predict Fraud</button>
        </form>
        {% if results %}
        <div class="result">
            <h3>Fraud Prediction: {{ results }}</h3>
        </div>
        {% endif %}
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
